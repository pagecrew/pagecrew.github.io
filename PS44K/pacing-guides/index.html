<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS 44K Interactive Pacing Guides</title>
<style>
  :root{
    --navy:#173B63; --navy-dark:#0F2A47; --gold:#F0B429; --gold-dark:#C4901A;
    --bg:#F5F7FA; --border:#E2E6EC; --text:#232A33; --text-muted:#5B6472;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header{ background:linear-gradient(135deg,var(--navy),var(--navy-dark)); color:#fff; padding:28px 32px; }
  header h1{ margin:0 0 6px; font-size:22px; }
  header p{ margin:0; color:#CFE0F5; font-size:14px; }
  main{ max-width:900px; margin:0 auto; padding:32px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .card{ display:block; background:#fff; border:1px solid var(--border); border-radius:10px; padding:20px; text-decoration:none; color:var(--text); box-shadow:0 1px 3px rgba(20,30,50,.06); transition:box-shadow .15s ease, transform .15s ease; }
  .card:hover{ box-shadow:0 4px 14px rgba(20,30,50,.12); transform:translateY(-1px); }
  .card .grade{ display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; background:var(--gold); color:var(--navy-dark); font-weight:700; margin-bottom:10px; }
  .card .name{ font-weight:700; font-size:15px; margin-bottom:4px; }
  .card .status{ font-size:12.5px; color:var(--text-muted); }
  .card.placeholder{ opacity:.55; pointer-events:none; }
  footer{ text-align:center; padding:20px; font-size:12px; color:var(--text-muted); }
</style>
</head>
<body>
<header>
  <h1>P.S. 44K &middot; Magnet School of Engineering &amp; Design</h1>
  <p>Interactive Weekly Pacing Guides &middot; 2026&ndash;2027 School Year</p>
</header>
<main>
  <div class="grid">
    <a class="card" href="3rd-grade/">
      <span class="grade">3</span>
      <div class="name">3rd Grade</div>
      <div class="status">Full year &middot; ready</div>
    </a>
    <div class="card placeholder">
      <span class="grade">K</span>
      <div class="name">Kindergarten</div>
      <div class="status">Coming soon</div>
    </div>
    <div class="card placeholder">
      <span class="grade">1</span>
      <div class="name">1st Grade</div>
      <div class="status">Coming soon</div>
    </div>
    <div class="card placeholder">
      <span class="grade">2</span>
      <div class="name">2nd Grade</div>
      <div class="status">Coming soon</div>
    </div>
    <div class="card placeholder">
      <span class="grade">4</span>
      <div class="name">4th Grade</div>
      <div class="status">Coming soon</div>
    </div>
    <div class="card placeholder">
      <span class="grade">5</span>
      <div class="name">5th Grade</div>
      <div class="status">Coming soon</div>
    </div>
  </div>
</main>
<footer>pagecrew.github.io/PS44K/pacing-guides</footer>
</body>
</html>
